<!-- Main Container -->
<main class="flex-1 flex items-center justify-center px-4 py-8 sm:py-12"><div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-[#E5E7EB] p-6 sm:p-8"><div class="text-center mb-6"><h2 class="text-2xl font-bold text-[#1a3353]">Masuk Akun</h2><p class="text-sm text-[#6B7280] mt-1">Silakan masuk menggunakan akun pelamar Anda</p></div><form action="#" class="space-y-4"><div class="space-y-1.5"><label for="applicantEmail" class="block text-xs font-semibold text-[#374151] uppercase tracking-wider">Email / Nomor Registrasi <span class="text-red-500">*</span></label><input id="applicantEmail" type="text" placeholder="nama@email.com" required="" class="w-full px-3.5 py-2.5 text-sm bg-white border border-[#D1D5DB] rounded-lg text-[#1f2937] placeholder-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[#0179B5]/20 focus:border-[#0179B5] transition-colors"></div><div class="space-y-1.5"><label for="applicantPassword" class="block text-xs font-semibold text-[#374151] uppercase tracking-wider">Password <span class="text-red-500">*</span></label><div class="relative"><input id="applicantPassword" type="password" placeholder="Masukkan password" required="" class="w-full pl-3.5 pr-10 py-2.5 text-sm bg-white border border-[#D1D5DB] rounded-lg text-[#1f2937] placeholder-[#9CA3AF] focus:outline-none focus:ring-2 focus:ring-[#0179B5]/20 focus:border-[#0179B5] transition-colors"><button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-[#9CA3AF] hover:text-[#4B5563] focus:outline-none"><i id="togglePasswordIcon" class="bi bi-eye text-base"></i></button></div></div><div class="flex items-center justify-between text-xs sm:text-sm pt-0.5"><label class="inline-flex items-center gap-2 cursor-pointer text-[#4B5563]"><input type="checkbox" class="w-4 h-4 rounded text-[#0179B5] border-[#D1D5DB] focus:ring-[#0179B5]"><span class="">Ingat Saya</span></label><a href="#" class="font-medium text-[#0179B5] hover:text-[#016699] hover:underline">Lupa Password?</a></div><button type="submit" class="w-full mt-2 py-2.5 px-4 bg-[#0179B5] hover:bg-[#016699] text-white text-sm font-semibold rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2">Masuk Sekarang</button></form><div class="mt-6 pt-5 border-t border-[#F3F4F6] text-center text-sm text-[#6B7280]">Belum memiliki akun? <a href="#" class="font-semibold text-[#0179B5] hover:text-[#016699] hover:underline">Daftar Sekarang</a></div></div></main><footer class="bg-white border-t border-[#E5E7EB] py-3.5 px-4 sm:px-8"><div class="max-w-5xl mx-auto flex items-center justify-between text-xs text-[#6B7280]"><p class="">© 2025 RSI Fatimah Banyuwangi. Hak Cipta Dilindungi.</p><div class="flex items-center gap-2"><a href="#" class="hover:text-[#0179B5] transition-colors">Kebijakan Privasi</a><span class="">•</span><a href="#" class="hover:text-[#0179B5] transition-colors">Syarat &amp; Ketentuan</a></div></div></footer>
<!-- Clean Minimal Copyright Footer -->

<!-- Toggle Password Interactivity -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('applicantPassword');
      const toggleIcon = document.getElementById('togglePasswordIcon');

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleIcon.classList.toggle('bi-eye', !isPassword);
          toggleIcon.classList.toggle('bi-eye-slash', isPassword);
        });
      }
    });
  </script>
