<!DOCTYPE html><html lang="id" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Daftar Akun - RSI Fatimah Banyuwangi</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    :root {
      --primary: #0179B5;
      --primary-hover: #016293;
      --primary-active: #014E75;
      --bg-page: #F6F8FA;
      --border-color: #E5E7EB;
      --text-main: #1F2937;
      --text-muted: #6B7280;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    /* Standalone Header matching Login Shell */
    .auth-header {
      background-color: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
      padding: 0.875rem 0;
    }

    .brand-logo-badge {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #0179B5 0%, #015885 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 2px 4px rgba(1, 121, 181, 0.2);
    }

    .brand-title {
      font-size: 1.025rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.775rem;
      color: var(--text-muted);
      line-height: 1.2;
    }

    .back-link {
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: var(--primary);
    }

    /* Main Auth Container */
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.25rem 1rem;
    }

    .auth-card {
      background: #FFFFFF;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      overflow: hidden;
      max-width: 980px;
      width: 100%;
    }

    /* Left Branding Banner (45%) */
    .auth-visual-col {
      background: linear-gradient(155deg, #0179B5 0%, #015885 100%);
      color: #FFFFFF;
      padding: 2.5rem 2.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .auth-visual-col::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .auth-badge-pill {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      font-size: 0.775rem;
      font-weight: 600;
      padding: 0.3rem 0.8rem;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      width: fit-content;
    }

    .visual-image-card {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin: 1.25rem 0;
    }

    .visual-image-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }

    .quote-text {
      font-size: 0.875rem;
      font-style: italic;
      line-height: 1.5;
      color: #E6F3FB;
      margin-bottom: 1.25rem;
    }

    .feature-check-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      font-size: 0.825rem;
      color: #E8F4FC;
    }

    .feature-check-list li {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .feature-check-list i {
      color: #6EE7B7;
      font-size: 0.95rem;
    }

    /* Right Form Area (55%) */
    .auth-form-col {
      padding: 2.5rem 2.5rem;
      background: #FFFFFF;
    }

    .form-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.35rem;
      letter-spacing: -0.015em;
    }

    .form-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.45;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.35rem;
    }

    .form-label .text-danger {
      color: #EF4444 !important;
    }

    .form-control {
      height: 42px;
      font-size: 0.875rem;
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem 0.85rem;
      color: var(--text-main);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-control:focus {
      background-color: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(1, 121, 181, 0.12);
    }

    .form-control::placeholder {
      color: #9CA3AF;
      font-size: 0.875rem;
    }

    /* Password Input with eye toggle */
    .input-group-password .form-control {
      border-right: none;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }

    .input-group-password .btn-toggle-pwd {
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-left: none;
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      color: #9CA3AF;
      padding: 0 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .input-group-password .btn-toggle-pwd:hover {
      color: var(--primary);
    }

    .input-group-password:focus-within .form-control,
    .input-group-password:focus-within .btn-toggle-pwd {
      border-color: var(--primary);
    }

    .helper-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    /* Checkbox & Terms */
    .form-check-input {
      width: 1rem;
      height: 1rem;
      margin-top: 0.18rem;
      border-radius: 4px;
      border-color: #D1D5DB;
      cursor: pointer;
    }

    .form-check-input:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .form-check-input:focus {
      box-shadow: 0 0 0 3px rgba(1, 121, 181, 0.15);
    }

    .form-check-label {
      font-size: 0.825rem;
      color: #4B5563;
      cursor: pointer;
      line-height: 1.45;
    }

    .terms-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .terms-link:hover {
      text-decoration: underline;
    }

    /* Submit CTA */
    .btn-submit-register {
      background-color: var(--primary);
      border: 1px solid var(--primary);
      color: #FFFFFF;
      font-size: 0.925rem;
      font-weight: 600;
      height: 44px;
      border-radius: 8px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn-submit-register:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #FFFFFF;
    }

    .btn-submit-register:active {
      background-color: var(--primary-active);
      transform: translateY(1px);
    }

    .auth-footer-text {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 1.15rem;
    }

    .login-link {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .login-link:hover {
      text-decoration: underline;
    }

    /* Security callout */
    .security-notice {
      background-color: #F0F7FB;
      border: 1px solid #D9EAF5;
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      margin-top: 1.25rem;
      font-size: 0.775rem;
      color: #1E4E70;
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      line-height: 1.4;
    }

    .security-notice i {
      font-size: 0.95rem;
      color: var(--primary);
      margin-top: 0.05rem;
    }

    /* Page Footer */
    .page-footer {
      background: transparent;
      padding: 1.25rem 0 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(0, 0, 0, 0.05);
    }

    .footer-links {
      display: inline-flex;
      gap: 1rem;
      list-style: none;
      padding: 0;
      margin: 0.35rem 0 0;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--primary);
    }

    @media (max-width: 991.98px) {
      .auth-visual-col {
        padding: 2rem 1.75rem;
      }
      .auth-form-col {
        padding: 2rem 1.75rem;
      }
      .visual-image-card img {
        height: 140px;
      }
    }

    @media (max-width: 767.98px) {
      .auth-visual-col {
        display: none;
      }
      .auth-form-col {
        padding: 1.75rem 1.25rem;
      }
      .auth-wrapper {
        padding: 1.25rem 0.75rem;
      }
      .form-title {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
<!-- STANDALONE HEADER (Identical to Login Shell) -->
<header class="auth-header">
<div class="container">
<div class="d-flex align-items-center justify-content-between">
<div class="d-flex align-items-center gap-3">
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXPXuOv3G-5c7eWxlrWEVyeR354IrI5zUCBD3ZsQuBq7-9NmbDZJq9S9_dpFlduC4V32jYOe8-IeYjlWESfbZULreXjPZGd1yck7HFVEXBoCkGAOgFcsOg-VRQ-_YCjbEJ11mbuftAos29Gx70RUn_2bhYCmuvyqurfXpg6_dm6HHBRRHgwH_5TSmwLFnpqbK-pGUG0gLOpQMbAbNSj9pB68BUlEX-2BGDhEP2mzPQP22J_wuv0_6VXBg8yyLiMCDKXF8" alt="Logo RSI Fatimah Banyuwangi" style="height: 38px; width: 38px; object-fit: contain; background: transparent; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; box-shadow: none; border-radius: 0px; padding: 0px;" class="">
<div>
<div class="brand-title">RSI Fatimah Banyuwangi</div>
<div class="brand-subtitle">Sistem Rekrutmen SDM Rumah Sakit</div>
</div>
</div>
<div>
<a class="back-link" href="#">
<i class="bi bi-arrow-left"></i>
<span class="">Kembali ke Lowongan</span>
</a>
</div>
</div>
</div>
</header>
<!-- MAIN REGISTRATION CONTAINER (45% LEFT : 55% RIGHT, MAX-WIDTH 980PX) -->
<main class="auth-wrapper">
<div class="auth-card" style="max-width: 520px; width: 100%; margin: 0 auto; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); padding: 2rem 2.25rem;">
<div class="mb-4 text-center">
<h1 class="form-title" style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; color: #1e293b;">Buat Akun Pelamar</h1>
<p class="form-subtitle" style="font-size: 0.875rem; color: #64748b; margin-bottom: 0;">Daftar untuk melamar lowongan di RSI Fatimah Banyuwangi</p>
</div>
<form id="registerForm" novalidate="">
<!-- Nama Lengkap -->
<div class="mb-3">
<label class="form-label" for="namaLengkap" style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem;">
        Nama Lengkap <span class="text-danger">*</span>
</label>
<input autocomplete="name" class="form-control" id="namaLengkap" placeholder="Masukkan nama sesuai KTP" required="" style="height: 42px; border-radius: 8px; border-color: #cbd5e1; font-size: 0.875rem;" type="text">
</div>
<!-- Nomor WhatsApp / HP -->
<div class="mb-3">
<label class="form-label" for="nomorHp" style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem;">
        Nomor WhatsApp / HP <span class="text-danger">*</span>
</label>
<input autocomplete="tel" class="form-control" id="nomorHp" placeholder="08xxxxxxxxxx" required="" style="height: 42px; border-radius: 8px; border-color: #cbd5e1; font-size: 0.875rem;" type="tel">
</div>
<!-- Email Aktif -->
<div class="mb-3">
<label class="form-label" for="email" style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem;">
        Email Aktif <span class="text-danger">*</span>
</label>
<input autocomplete="email" class="form-control" id="email" placeholder="nama@email.com" required="" style="height: 42px; border-radius: 8px; border-color: #cbd5e1; font-size: 0.875rem;" type="email">
</div>
<!-- Password -->
<div class="mb-3">
<label class="form-label" for="password" style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem;">
        Password <span class="text-danger">*</span>
</label>
<div class="input-group input-group-password">
<input autocomplete="new-password" class="form-control" id="password" minlength="8" placeholder="Minimal 8 karakter" required="" style="height: 42px; border-radius: 8px 0 0 8px; border-color: #cbd5e1; font-size: 0.875rem;" type="password">
<button aria-label="Lihat password" class="btn-toggle-pwd" id="togglePwd" style="border-color: #cbd5e1;" type="button">
<i class="bi bi-eye" id="togglePwdIcon"></i>
</button>
</div>
</div>
<!-- Konfirmasi Password -->
<div class="mb-3">
<label class="form-label" for="confirmPassword" style="font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem;">
        Konfirmasi Password <span class="text-danger">*</span>
</label>
<div class="input-group input-group-password">
<input autocomplete="new-password" class="form-control" id="confirmPassword" minlength="8" placeholder="Ulangi password" required="" style="height: 42px; border-radius: 8px 0 0 8px; border-color: #cbd5e1; font-size: 0.875rem;" type="password">
<button aria-label="Lihat konfirmasi password" class="btn-toggle-pwd" id="toggleConfirmPwd" style="border-color: #cbd5e1;" type="button">
<i class="bi bi-eye" id="toggleConfirmPwdIcon"></i>
</button>
</div>
</div>
<!-- Checkbox Terms & Privacy -->
<div class="mb-4">
<div class="form-check">
<input class="form-check-input" id="termsCheck" required="" type="checkbox">
<label class="form-check-label" for="termsCheck" style="font-size: 0.825rem; color: #475569;">
          Saya menyetujui <a class="terms-link" href="#">Syarat &amp; Ketentuan</a> serta <a class="terms-link" href="#">Kebijakan Privasi</a>
</label>
</div>
</div>
<!-- Primary Action Button -->
<button class="btn btn-submit-register" style="background-color: #0179B5; border-color: #0179B5; height: 44px; font-weight: 600; border-radius: 8px; width: 100%;" type="submit">
<span class="">Daftar Akun</span>
</button>
<!-- Link to Login -->
<div class="auth-footer-text" style="text-align: center; font-size: 0.85rem; color: #64748b; margin-top: 1rem;">
      Sudah memiliki akun? <a class="login-link" href="#" style="color: #0179B5; font-weight: 600;">Masuk Sekarang</a>
</div>
<!-- Security Notice -->

</form>
</div>
</main><footer style="background-color: rgb(255, 255, 255); border-top: 1px solid rgb(229, 231, 235); padding: 1rem 0px; font-size: 0.8125rem; color: rgb(107, 114, 128);">
  <div class="container">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
      <div class="">© 2025 RSI Fatimah Banyuwangi. Hak Cipta Dilindungi.</div>
      <div class="d-flex align-items-center gap-2">
        <a href="#" style="color: #6b7280; text-decoration: none; transition: color 0.15s;" onmouseover="this.style.color='#0179B5'" onmouseout="this.style.color='#6b7280'" class="">Kebijakan Privasi</a>
        <span class="">•</span>
        <a href="#" style="color: #6b7280; text-decoration: none; transition: color 0.15s;" onmouseover="this.style.color='#0179B5'" onmouseout="this.style.color='#6b7280'" class="">Syarat &amp; Ketentuan</a>
      </div>
    </div>
  </div>
</footer>
<!-- FOOTER -->

<!-- Interactivity Script -->
<script>
    // Password visibility toggles
    const togglePwd = document.getElementById('togglePwd');
    const pwdInput = document.getElementById('password');
    const togglePwdIcon = document.getElementById('togglePwdIcon');

    if (togglePwd && pwdInput) {
      togglePwd.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePwdIcon.classList.toggle('bi-eye');
        togglePwdIcon.classList.toggle('bi-eye-slash');
      });
    }

    const toggleConfirmPwd = document.getElementById('toggleConfirmPwd');
    const confirmPwdInput = document.getElementById('confirmPassword');
    const toggleConfirmPwdIcon = document.getElementById('toggleConfirmPwdIcon');

    if (toggleConfirmPwd && confirmPwdInput) {
      toggleConfirmPwd.addEventListener('click', function() {
        const isPassword = confirmPwdInput.getAttribute('type') === 'password';
        confirmPwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleConfirmPwdIcon.classList.toggle('bi-eye');
        toggleConfirmPwdIcon.classList.toggle('bi-eye-slash');
      });
    }

    // Form submission validation
    const form = document.getElementById('registerForm');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (pwdInput.value && confirmPwdInput.value && pwdInput.value !== confirmPwdInput.value) {
          alert('Konfirmasi password tidak sesuai.');
          confirmPwdInput.focus();
          return;
        }
        const terms = document.getElementById('termsCheck');
        if (!terms.checked) {
          alert('Silakan setujui Syarat & Ketentuan serta Kebijakan Privasi.');
          return;
        }
        alert('Pendaftaran berhasil! Silakan masuk ke akun Anda.');
      });
    }
  </script>






</body></html>
